asyncapi_note: >-
  Vyond publishes no AsyncAPI document. Probed https://api.vyond.com/asyncapi.yaml,
  /asyncapi.json and the GitHub organizations — nothing. The event surface below is
  derived from the Webhook and Turbo tag descriptions and the Webhook component
  schema in the published OpenAPI, which is where Vyond actually documents it.
transport: HTTPS POST to a consumer-supplied URL (https required)
delivery:
  modes:
  - name: subscription
    description: >-
      A persistent webhook registered through the Webhook management API. Owner type
      must be `user`.
    operations:
    - WebhookController.getWebhooks
    - WebhookController.createWebhook
    - WebhookController.updateWebhook
    - WebhookController.deleteWebhook
  - name: one-off callbackWebhook
    description: >-
      A url+secret supplied inline on the create request, scoped to that single
      task.
    accepted_by:
    - TurboController.createTurbo
    - ContentGenerationV2Controller.createGeneration
    - VideoController.exportVideo
  - name: zapier
    description: >-
      A ZapierCallbackInfo callback type restricted to URLs beginning
      https://hooks.zapier.com/
  always_emitted: >-
    Vyond states webhook events are always emitted for every task, so a subscription
    registered before completion will receive the event regardless of polling.
security:
  signature:
    algorithm: HMAC-SHA256
    encoding: hex
    message: '{x-vyond-request-timestamp}:{raw request body}'
    headers:
      signature: x-vyond-signature
      timestamp: x-vyond-request-timestamp
    secret:
      supplied_by: consumer
      pattern: '^[0-9A-Za-z]{64}$'
      length: 64
    optional: >-
      If no secret is supplied on a one-off callbackWebhook, the request is
      delivered without a signature.
    replay_protection: >-
      Recommended (not enforced by Vyond): reject timestamps older than a tolerance
      such as ten minutes.
subscription_model:
  resource: Webhook
  fields: [webhookId, name, url, events, status]
  status_values: [enabled, disabled]
  url_constraint: https only
