versioning:
  scheme: uri-path
  form: https://api.vyond.com/rest/{version}/{path}
  current: v2
  live: [v1, v2]
  docs: https://api.vyond.com/doc/#tag/Introduction
  document_version: 1.1.0
  note: >-
    v1 and v2 of content generation are both documented and both live. Vyond does
    not state which is preferred, does not mark v1 deprecated, and gives no
    migration guidance — the only observable difference is that v2 adds a readable
    task (GET /rest/v2/generations/{id}) that v1 lacks. Turbo, video export,
    parameters, user and webhooks are v1-only. SCIM is fixed at /scim/v2/ by the
    SCIM 2.0 standard rather than by Vyond's version train.
