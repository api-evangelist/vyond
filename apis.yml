aid: vyond
name: Vyond
description: 'Vyond is a business video creation platform — formerly GoAnimate — used
  by enterprise learning, HR, sales enablement and internal-communications teams to
  produce animated, AI-avatar, mixed-media and screen-recorded video. Alongside the
  Vyond Studio web application and the generative Vyond Go and Turbo products, Vyond
  publishes a public OpenAPI 3.0 contract at api.vyond.com/doc/ covering two distinct
  surfaces: a versioned REST API (/rest/{version}/) for content generation, Turbo text-to-video
  tasks, video export, parameter lookup and HMAC-signed webhook subscriptions, and a
  SCIM 2.0 API (/scim/v2/) for enterprise user provisioning against identity providers
  such as Okta. Access is bearer-token based — API tokens for SCIM, OAuth 2.0 access
  tokens for REST — and is scoped per feature (VYOND_GO, VIDEO_EXPORT).'
