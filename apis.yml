  description: 'The Vyond API lets a platform create Vyond Go and AI-avatar videos,
    run Turbo text-prompt video generation, export videos, read feature parameters,
    manage users over SCIM 2.0, and subscribe to HMAC-signed webhook events — all
    without using the Vyond web application.'
