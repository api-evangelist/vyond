standards:
- id: openapi-3.0
  conforms: true
  evidence: >-
    openapi 3.0.0 document published at https://api.vyond.com/doc/openapi.json
    (HTTP 200, application/json, 81,751 bytes) — 15 paths, 20 operations,
    66 component schemas, every operation carrying an operationId, summary,
    tags and 2xx/4xx/5xx responses.
- id: scim-2.0
  conforms: true
  evidence: >-
    /scim/v2/Users, /scim/v2/Schemas implemented with application/scim+json
    responses, urn:ietf:params:scim:api:messages:2.0 schema URNs,
    startIndex/count pagination, SCIM filter grammar, PATCH operations and
    scimType error discriminators. Verified live: unauthenticated GET
    https://api.vyond.com/scim/v2/ServiceProviderConfig returned 401 with
    content-type application/scim+json and a
    urn:ietf:params:scim:api:messages:2.0:Error body.
  spec: RFC 7643 / RFC 7644
  gaps:
  - >-
    Groups are not supported — Vyond's own SCIM Provisioning article states
    "Groups is not supported in the current version", although ScimGroup /
    ScimGroupList schemas exist in the OpenAPI components.
  - >-
    /scim/v2/ServiceProviderConfig and /scim/v2/ResourceTypes are live on the
    host but are not declared in the OpenAPI.
- id: oauth2
  conforms: partial
  evidence: >-
    The Introduction documents OAuth 2.0 access tokens with refresh-token renewal
    for the REST API, but the OpenAPI declares only an http/bearer scheme — no
    oauth2 securityScheme, no flows, no authorizationUrl/tokenUrl. No RFC 8414
    metadata document (probed /.well-known/oauth-authorization-server, 404).
