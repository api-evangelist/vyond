openapi: 3.2.0
info:
  title: Vyond API Documentation Webhook API
  version: 1.1.0
  description: 'APIs for managing webhook


    ## Verifying Vyond Signatures


    Vyond webhook events are sent with a signature, which the destination server can use to verify that the events are authentic from Vyond.'
tags:
- name: Webhook
  description: 'APIs for managing webhook


    ## Verifying Vyond Signatures


    Vyond webhook events are sent with a signature, which the destination server can use to verify that the events are authentic from Vyond.'
paths:
  /rest/v1/webhooks/:
    get:
      operationId: WebhookController.getWebhooks
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResBody'
          description: List of webhooks
        '401':
          description: Unauthorized - missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden - invalid owner type (non-user token)
        '429':
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error - unexpected error while retrieving webhooks
      summary: List webhooks
      tags:
      - Webhook
      security:
      - bearer: []
      description: List webhooks owned by the user
    post:
      operationId: WebhookController.createWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateReqBody'
        description: WebhookCreateReqBody
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
          description: Created webhook
        '401':
          description: Unauthorized - missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden - invalid owner type (non-user token)
        '429':
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error - unexpected error while creating webhook
      summary: Create webhook
      tags:
      - Webhook
      security:
      - bearer: []
      description: Register a new webhook on Vyond, default enabled
  /rest/v1/webhooks/{webhookId}:
    patch:
      operationId: WebhookController.updateWebhook
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[^\/#\?]+?'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdateReqBody'
        description: WebhookUpdateReqBody
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          description: Updated webhook
        '401':
          description: Unauthorized - missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden - invalid owner type (non-user token)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found - webhook does not exist or does not belong to the user
        '429':
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error - unexpected error while updating webhook
      summary: Update webhook
      tags:
      - Webhook
      security:
      - bearer: []
      description: Update an existing webhook
    delete:
      operationId: WebhookController.deleteWebhook
      parameters:
      - in: path
        name: webhookId
        required: true
        schema:
          pattern: '[^\/#\?]+?'
          type: string
      responses:
        '204':
          content:
            application/json: {}
          description: Webhook is deleted successfully
        '401':
          description: Unauthorized - missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden - invalid owner type (non-user token)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not Found - webhook does not exist or does not belong to the user
        '429':
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal Server Error - unexpected error while deleting webhook
      summary: Delete webhook
      tags:
      - Webhook
      security:
      - bearer: []
      description: Delete an existing webhook
components:
  schemas:
    WebhookWithSecret:
      properties:
        secret:
          type: string
          description: Secret of the webhook which is required to [verify signatures](#tag/Webhook/Verifying-Vyond-Signatures) from Vyond,             note that this secret is only available at time of webhook creation
        webhookId:
          type: string
          description: ID of the webhook
        name:
          type: string
          description: Name of the webhook
        url:
          format: url
          type: string
          description: URL of the webhook, must be in https
        events:
          items:
            enum:
            - video_generation.succeeded
            - video_generation.failed
            - video_export.succeeded
            - video_export.failed
            - turbo_generation.succeeded
            - turbo_generation.failed
            type: string
          type: array
          description: Events that the webhook subscribed to
        status:
          type: string
          enum:
          - enabled
          - disabled
          description: Status of the webhook
      type: object
      required:
      - secret
      - webhookId
      - url
      - events
      - status
    ValidationDetail:
      properties:
        property:
          type: string
          description: The property that failed validation
        message:
          items:
            type: string
          type: array
          description: Validation error messages for the property
      type: object
      required:
      - property
      - message
    Webhook:
      properties:
        webhookId:
          type: string
          description: ID of the webhook
        name:
          type: string
          description: Name of the webhook
        url:
          format: url
          type: string
          description: URL of the webhook, must be in https
        events:
          items:
            enum:
            - video_generation.succeeded
            - video_generation.failed
            - video_export.succeeded
            - video_export.failed
            - turbo_generation.succeeded
            - turbo_generation.failed
            type: string
          type: array
          description: Events that the webhook subscribed to
        status:
          type: string
          enum:
          - enabled
          - disabled
          description: Status of the webhook
      type: object
      required:
      - webhookId
      - url
      - events
      - status
    WebhookUpdateReqBody:
      properties:
        name:
          type: string
          description: Name of the webhook
        url:
          format: url
          type: string
          description: URL of the webhook, protocol must be https
        events:
          items:
            enum:
            - video_generation.succeeded
            - video_generation.failed
            - video_export.succeeded
            - video_export.failed
            - turbo_generation.succeeded
            - turbo_generation.failed
            type: string
          type: array
          description: Events that the webhook subscribed to
        status:
          type: string
          enum:
          - enabled
          - disabled
          description: Status of the webhook
      type: object
    WebhookListResBody:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Webhook'
          type: array
          description: List of webhooks
      type: object
      required:
      - data
    WebhookCreateReqBody:
      properties:
        name:
          type: string
          description: Name of the webhook
        url:
          format: url
          type: string
          description: URL of the webhook, protocol must be https
        events:
          items:
            enum:
            - video_generation.succeeded
            - video_generation.failed
            - video_export.succeeded
            - video_export.failed
            - turbo_generation.succeeded
            - turbo_generation.failed
            type: string
          type: array
          description: Events that the webhook subscribed to
      type: object
      required:
      - url
      - events
    ApiErrorResponse:
      properties:
        err:
          type: string
          description: Error code identifying the specific error
        reason:
          type: string
          description: Additional reason describing why the error occurred
        message:
          type: string
          description: Error message, used as an alternative to reason for non-enumerated error messages
        scimType:
          type: string
          description: SCIM error type, present on SCIM 409 Conflict responses (e.g. uniqueness)
        details:
          items:
            $ref: '#/components/schemas/ValidationDetail'
          type: array
          description: Validation error details, present when err is REQUEST_VALIDATION_FAILED
      type: object
      required:
      - err
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
