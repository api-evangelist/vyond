    before the task completes, or supply a one-off `callbackWebhook` in the create request.


    | Event                        | Description                                                                                                         |

    | ---------------------------- | -------------------------------------------------------------------------------------------------------------------
    |

    | `turbo_generation.succeeded` | The Turbo video generation completed successfully. `data` contains
